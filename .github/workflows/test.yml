name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/client.js
      - name: Unit tests (converters + memory parsing)
        run: node .selftest.mjs
      - name: Integration tests (host routes)
        run: node .selftest-e2e.mjs
